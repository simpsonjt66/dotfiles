main_menu:
  - name: '󰀻 Apps'
    command: 'apps'
  - name: ' Config'
    command: 'config'
  - name: ' Font'
    command: 'font'
  - name: ' System' 
    command: 'system'
  - name: '󰸌 Theme' 
    command: 'theme'
  - name: ' Screenshot' 
    command: 'screenshot'
  - name: '󰔎 Toggle' 
    command: 'toggle'
system_menu:
  - prompt: ' Lock'     
    command: 'loginctl lock-session'
  - prompt: ' Suspend'  
    command: 'systemctl suspend' 
    confirm: 'Suspend system?'
  - prompt: '󰈆 Logout'
    command: 'hyprctl dispatch exit'
    confirm: 'Logout?'
  - prompt: ' Reboot'
    command: 'systemctl reboot'
    confirm: 'Reboot system?'
  - prompt: '󰐥 Shutdown'
    command: 'systemctl poweroff'
    confirm: 'Shutdown system?'
config_menu:
  - prompt: ' Alacritty' 
    command: '/alacritty/alacritty.toml'
  - prompt: ' Dunst' 
    command: '/dunst/dunstrc'
  - prompt: ' Hypridle' 
    command: '/hypr/hypridle.conf'
  - prompt: ' Hyprland' 
    command: '/hypr/hyprland.conf'
  - prompt: ' Kitty' 
    command: '/kitty/kitty.conf'
  - prompt: ' Rofi' 
    command: '/rofi/config.rasi'
  - prompt: ' Waybar' 
    command: '/waybar/config.jsonc'
  - prompt: ' Zsh' 
    command: '/zsh/.zshrc'
